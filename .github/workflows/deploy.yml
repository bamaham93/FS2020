name: Django CD - PythonAnywhere Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: deploy-pythonanywhere
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # If your tests need env vars, add them here under env:
      - name: Run Django tests
        run: |
          python python_anywhere_website/manage.py test -v 2

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PA_HOST }}
          username: ${{ secrets.PA_USERNAME }}
          key: ${{ secrets.PA_SSH_KEY }}
          script: |
            cd /home/Bamaham93/FS2020
            chmod 755 deploy_pythonanywhere.sh
            sed -i 's/\r$//' deploy_pythonanywhere.sh || true
            bash ./deploy_pythonanywhere.sh ${{ github.sha }}

      - name: Reload PythonAnywhere webapp
        env:
          PA_API_KEY: ${{ secrets.PA_API_KEY }}
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_DOMAIN_NAME: ${{ secrets.PA_DOMAIN_NAME }}
        run: |
          if [ -z "${PA_API_KEY}" ]; then
            echo "PA_API_KEY is empty (GitHub secret missing or not exposed)"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Token ${PA_API_KEY}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN_NAME}/reload/"
