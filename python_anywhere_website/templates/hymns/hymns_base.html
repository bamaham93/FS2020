{% extends 'base.html' %}

{% block section1 %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <div>
    <h1 class="h3 mb-1">Hymn Planner</h1>
    <div class="text-muted">Build hymn lists from approved hymnal entries.</div>
  </div>
  <div class="btn-group">
    <a class="btn btn-outline-light btn-sm" href="{% url 'hymns:index' %}">Dashboard</a>
    {% if user.is_staff %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'hymns:service_plan_list' %}">Plans</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'hymns:import_batches' %}">Imports</a>
    {% endif %}
  </div>
</div>
{% block hymns_content %}{% endblock %}
{% endblock %}
