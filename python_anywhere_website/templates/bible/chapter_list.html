{% extends "base.html" %}

{% block section1 %}
<div class="bible-reader">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'bible:index' %}">Bible</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ book.name }}</li>
        </ol>
    </nav>

    <header class="mb-4">
        <h1>{{ book.name }}</h1>
        <p class="text-muted">{{ book.get_testament_display }}</p>
    </header>

    <div class="chapters-grid">
        {% for chapter_num in chapters %}
        <a href="{% url 'bible:chapter_reader' book.slug chapter_num %}" class="chapter-link">
            {{ chapter_num }}
        </a>
        {% endfor %}
    </div>
</div>

<style>
    .bible-reader {
        max-width: 900px;
        margin: 0 auto;
        font-family: Georgia, serif;
    }
    .bible-reader h1 {
        color: #e0e0e0 !important;
    }
    .bible-reader .breadcrumb-item,
    .bible-reader .breadcrumb-item a {
        color: #999 !important;
    }
    .bible-reader .text-muted {
        color: #999 !important;
    }
    .chapters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 10px;
        margin-top: 2rem;
    }
    .chapter-link {
        display: block;
        padding: 15px;
        text-align: center;
        border: 1px solid #555;
        border-radius: 4px;
        text-decoration: none;
        color: #7db3ff;
        transition: all 0.2s;
    }
    .chapter-link:hover {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: #888;
        color: #a8d0ff;
    }
</style>
{% endblock %}
