{% comment %}
This template is designed to be loaded into the modal container.
{% endcomment %}

<div class="container">
    <h3>Add / Lookup by Barcode</h3>
    <form method="post" class="p-2">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark">Lookup</button>
    </form>

    <p class="mt-3"><a href="{% url 'media:scan_barcode' %}" class="btn btn-link open-in-modal" data-title="Scan Barcode">📷 Use camera to scan barcode</a></p>
    <p class="mt-3"><a href="{% url 'media:add_media' %}" class="btn btn-link">Add media manually</a></p>
</div>
