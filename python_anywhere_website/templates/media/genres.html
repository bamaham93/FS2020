{% extends 'media/media_base.html' %}

{% block section1 %}
  <h1>Genres</h1>
  <div class="list-group">
    {% for g in genres %}
      <a href="{% url 'media:sorted_by' %}?genre={{ g.name }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ g.name }}
        <span class="badge bg-secondary rounded-pill">{{ g.media_set.count }}</span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
