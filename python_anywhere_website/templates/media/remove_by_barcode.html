{% comment %}
Modal-friendly remove template.
{% endcomment %}

<div class="container">
    <h3>Remove by Barcode</h3>
    <form method="post" class="p-2">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-danger">Remove</button>
    </form>

    <p class="mt-3"><a href="{% url 'media:index' %}" class="btn btn-link">Back to media</a></p>
</div>
