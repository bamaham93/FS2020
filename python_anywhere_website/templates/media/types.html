{% extends 'media/media_base.html' %}

{% block section1 %}
  <h1>Types</h1>
  <div class="list-group">
    {% for t in types %}
      <a href="{% url 'media:sorted_by' %}?type={{ t.name }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ t.name }}
        <span class="badge bg-secondary rounded-pill">{{ t.media_set.count }}</span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
